kind = "web"
previewPath = "/"
title = "Stillwell Recovery"
description = "A private self-guided concussion and post-concussive recovery journal with a starting quiz, email accounts, personalized educational routines, and saved symptom and activity logs. Includes consent, account-restricted access, and recovery-data deletion controls."
version = "1.0.0"
id = "artifacts/stillwell-recovery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25321

[services.development]
run = "pnpm --filter @workspace/stillwell-recovery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stillwell-recovery", "run", "build" ]
serve = "static"
publicDir = "artifacts/stillwell-recovery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25321"
BASE_PATH = "/"
