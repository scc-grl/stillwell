<!-- @dsCard group="Layout" height=520 subtitle="Panel, choice cards and notes" -->
<div class="sw-stage sw-stage--col">
  <section class="sw-panel">
    <p class="sw-eyebrow">A small beginning</p>
    <h2 class="sw-display" style="font-size:32px;line-height:1.25">What would feel useful?</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
      <button type="button" class="sw-choice" aria-pressed="true"><span class="sw-choice__title">Self-guided <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="sw-choice__text">A personal place to notice patterns and shape gentle routines.</span></button>
      <button type="button" class="sw-choice" aria-pressed="false"><span class="sw-choice__title">With clinician support</span><span class="sw-choice__text">Keep your own journal, with room to bring reflections to a clinician.</span></button>
    </div>
    <div class="sw-note" style="margin-top:16px">Only record what you choose. Leave every symptom blank if you would rather not track it.</div>
    <div class="sw-notice" style="margin-top:12px"><b>Not for a new injury or an emergency</b><span>If symptoms are worsening, contact a clinician. Severe or urgent symptoms need emergency care now.</span></div>
  </section>
</div>
