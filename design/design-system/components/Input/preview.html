<!-- @dsCard group="Forms" height=300 subtitle="Text field, small numeric field, error" -->
<div class="sw-stage sw-stage--col">
  <div><label class="sw-label" for="e">Email address</label><input id="e" class="sw-input" type="email" placeholder="you@example.com"></div>
  <div><label class="sw-label" for="m">Optional duration, not a target <small>minutes</small></label><input id="m" class="sw-input sw-input--sm" type="number" min="0" max="240" placeholder="0"></div>
  <div><label class="sw-label" for="x">Disabled</label><input id="x" class="sw-input" disabled value="Saved"></div>
  <p class="sw-error" role="alert">Please review and accept before creating your private journal.</p>
</div>
