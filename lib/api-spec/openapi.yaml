openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsletter
    description: Public newsletter subscription
  - name: account
    description: Account type and sign-up registration
paths:
  /account/registration-intent:
    post:
      operationId: createAccountRegistrationIntent
      tags: [account]
      summary: Create a short-lived signed account-type registration intent before sign-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRegistrationIntentInput"
      responses:
        "201":
          description: Signed registration intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRegistrationIntent"
        "400":
          description: Invalid account type
  /account/type:
    get:
      operationId: getAccountType
      tags: [account]
      summary: Get the signed-in person's account type
      responses:
        "200":
          description: Account type (legacy accounts default to patient)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTypeResponse"
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /account/complete-registration:
    post:
      operationId: completeAccountRegistration
      tags: [account]
      summary: Record the selected account type for a newly created Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAccountRegistrationInput"
      responses:
        "200":
          description: Account type recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTypeResponse"
        "400":
          description: Invalid, expired, or pre-existing-account registration intent
        "401":
          description: Sign-in required
        "409":
          description: Registration intent already used by another account
  /recovery:
    get:
      operationId: getRecovery
      summary: Get the signed-in person's recovery profile and daily logs
      responses:
        "200":
          description: Private recovery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryState"
        "401":
          description: Sign-in required
    delete:
      operationId: deleteRecovery
      summary: Delete all recovery data belonging to the signed-in person
      responses:
        "204":
          description: Recovery data deleted
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /recovery/start:
    post:
      operationId: startRecovery
      summary: Save consent, quiz preferences, and first daily log atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryStartInput"
      responses:
        "201":
          description: Saved recovery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryState"
        "400":
          description: Invalid input or missing consent
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /recovery/profile:
    put:
      operationId: updateRecoveryProfile
      summary: Update personal routine priorities and support mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryPreferences"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryProfile"
        "400":
          description: Invalid preferences
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
        "404":
          description: Complete onboarding first
  /recovery/logs:
    post:
      operationId: saveRecoveryLog
      summary: Create or update the signed-in person's entry for a calendar day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryLogInput"
      responses:
        "200":
          description: Saved daily log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryLog"
        "400":
          description: Invalid entry
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
        "404":
          description: Complete onboarding first
  /recovery/logs/{date}:
    delete:
      operationId: deleteRecoveryLog
      summary: Delete the signed-in person's entry for one day
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "204":
          description: Entry deleted
        "400":
          description: Invalid date
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to Stillwell updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "202":
          description: Subscription accepted (including repeat submissions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionAccepted"
        "400":
          description: Invalid email address
  /newsletter/unsubscribe:
    post:
      operationId: unsubscribeNewsletter
      tags: [newsletter]
      summary: Remove an email address from Stillwell updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "200":
          description: Unsubscription accepted, whether or not the address was on the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterUnsubscriptionAccepted"
        "400":
          description: Invalid email address
components:
  schemas:
    AccountType:
      type: string
      enum: [patient, clinician]
    AccountTypeResponse:
      type: object
      additionalProperties: false
      required: [accountType]
      properties:
        accountType:
          $ref: "#/components/schemas/AccountType"
    AccountRegistrationIntentInput:
      type: object
      additionalProperties: false
      required: [accountType]
      properties:
        accountType:
          $ref: "#/components/schemas/AccountType"
    AccountRegistrationIntent:
      type: object
      additionalProperties: false
      required: [registrationToken]
      properties:
        registrationToken:
          type: string
          minLength: 1
          maxLength: 4096
    CompleteAccountRegistrationInput:
      type: object
      additionalProperties: false
      required: [registrationToken]
      properties:
        registrationToken:
          type: string
          minLength: 1
          maxLength: 4096
    RecoveryPreferences:
      type: object
      additionalProperties: false
      required: [supportMode, priorities]
      properties:
        supportMode:
          type: string
          enum: [self_guided, clinician_supported]
        priorities:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [food_hydration, movement, meditation, pacing]
    SymptomEntry:
      type: object
      additionalProperties: false
      required: [name, severity]
      properties:
        name:
          type: string
          enum: [headache, dizziness, focus, fatigue, sleep, light_sound, mood]
        severity:
          type: integer
          minimum: 0
          maximum: 10
    ActivityStatus:
      type: string
      enum: [done, not_done, not_planned]
    RecoveryLogInput:
      type: object
      additionalProperties: false
      required: [date, symptoms, dietStatus, dietNote, exerciseStatus, exerciseNote, meditationStatus, meditationMinutes, meditationNote, note]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        symptoms:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/SymptomEntry"
        dietStatus:
          $ref: "#/components/schemas/ActivityStatus"
        dietNote:
          type: string
          maxLength: 2000
        exerciseStatus:
          $ref: "#/components/schemas/ActivityStatus"
        exerciseNote:
          type: string
          maxLength: 2000
        meditationStatus:
          $ref: "#/components/schemas/ActivityStatus"
        meditationMinutes:
          type: integer
          minimum: 0
          maximum: 240
        meditationNote:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000
    RecoveryStartInput:
      type: object
      additionalProperties: false
      required: [preferences, consentAccepted, firstLog]
      properties:
        preferences:
          $ref: "#/components/schemas/RecoveryPreferences"
        consentAccepted:
          type: boolean
          enum: [true]
        firstLog:
          $ref: "#/components/schemas/RecoveryLogInput"
    RecoveryProfile:
      allOf:
        - $ref: "#/components/schemas/RecoveryPreferences"
        - type: object
          required: [consentVersion, consentedAt]
          properties:
            consentVersion:
              type: string
            consentedAt:
              type: string
              format: date-time
    RecoveryLog:
      allOf:
        - $ref: "#/components/schemas/RecoveryLogInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: string
              format: date-time
    RecoveryState:
      type: object
      required: [profile, logs]
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/RecoveryProfile"
            - type: "null"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryLog"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NewsletterSubscriptionInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    NewsletterSubscriptionAccepted:
      type: object
      additionalProperties: false
      required: [subscribed]
      properties:
        subscribed:
          type: boolean
          enum: [true]
    NewsletterUnsubscriptionAccepted:
      type: object
      additionalProperties: false
      required: [unsubscribed]
      properties:
        unsubscribed:
          type: boolean
          enum: [true]

