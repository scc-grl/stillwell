openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsletter
    description: Public newsletter subscription
  - name: account
    description: Account type and sign-up registration
  - name: partners
    description: Public organization requests and clinician profiles
  - name: journal-sharing
    description: Patient-controlled clinician invitations and journal access
  - name: admin
    description: Stillwell team review tools
paths:
  /patient/care-team:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team"
  /patient/care-team/invites:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1invites"
  /patient/care-team/invites/{id}/resend:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1invites~1{id}~1resend"
  /patient/care-team/invites/{id}/undo-cancel:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1invites~1{id}~1undo-cancel"
  /patient/care-team/invites/{id}:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1invites~1{id}"
  /patient/care-team/links/{id}:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1links~1{id}"
  /patient/care-team/requests/{token}:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1requests~1{token}"
  /care-team/invites/{token}/preview:
    $ref: "./care-team.yaml#/paths/~1care-team~1invites~1{token}~1preview"
  /clinician/care-team/invites/{token}:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1invites~1{token}"
  /care-team/requests/{token}/preview:
    $ref: "./care-team.yaml#/paths/~1care-team~1requests~1{token}~1preview"
  /patient/care-team/requests/{token}/respond:
    $ref: "./care-team.yaml#/paths/~1patient~1care-team~1requests~1{token}~1respond"
  /clinician/care-team/invites/{token}/accept:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1invites~1{token}~1accept"
  /clinician/care-team/patients:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1patients"
  /clinician/care-team/patients/{id}:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1patients~1{id}"
  /clinician/care-team/requests:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1requests"
  /clinician/care-team/requests/{id}/resend:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1requests~1{id}~1resend"
  /clinician/care-team/requests/{id}:
    $ref: "./care-team.yaml#/paths/~1clinician~1care-team~1requests~1{id}"
  /account/registration-intent:
    post:
      operationId: createAccountRegistrationIntent
      tags: [account]
      summary: Create a short-lived signed account-type registration intent before sign-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRegistrationIntentInput"
      responses:
        "201":
          description: Signed registration intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRegistrationIntent"
        "400":
          description: Invalid account type
  /account/type:
    get:
      operationId: getAccountType
      tags: [account]
      summary: Get the signed-in person's account type
      responses:
        "200":
          description: Account type (legacy accounts default to patient)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTypeResponse"
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /account/complete-registration:
    post:
      operationId: completeAccountRegistration
      tags: [account]
      summary: Record the selected account type for a newly created Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAccountRegistrationInput"
      responses:
        "200":
          description: Account type recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTypeResponse"
        "400":
          description: Invalid, expired, or pre-existing-account registration intent
        "401":
          description: Sign-in required
        "409":
          description: Registration intent already used by another account
  /partnership-requests:
    description: "Planned only. The API currently returns HTTP 410 for this path; partnership intake is not active."
    post:
      operationId: createPartnershipRequest
      tags: [partners]
      summary: Save a partnership request for manual Stillwell team follow-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerRequestInput"
      responses:
        "201":
          description: Request saved; email notification may not be configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRequestAccepted"
        "400":
          description: Invalid request
  /admin/partnership-requests:
    description: "Planned only. The API currently returns HTTP 410 for this path; no partnership-request inbox is active."
    get:
      operationId: listPartnershipRequests
      tags: [admin]
      summary: List partnership requests for an authorized Stillwell administrator
      responses:
        "200":
          description: Saved partnership requests, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRequestList"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /clinician/profile:
    get:
      operationId: getClinicianProfile
      tags: [partners]
      summary: Get the signed-in clinician's own profile
      responses:
        "200":
          description: Clinician profile, if completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianProfileResponse"
        "401":
          description: Sign-in required
        "403":
          description: Clinician account required
    put:
      operationId: saveClinicianProfile
      tags: [partners]
      summary: Save the signed-in clinician's profile and manual verification request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianProfileInput"
      responses:
        "200":
          description: Profile saved with verification pending unless already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianProfile"
        "400":
          description: Invalid profile or terms not accepted
        "401":
          description: Sign-in required
        "403":
          description: Clinician account required
  /clinicians:
    description: "Planned only. The API currently returns HTTP 410 for this path; there is no public clinician directory."
    get:
      operationId: listPublicClinicians
      tags: [partners]
      summary: List clinician profiles approved for public directory display
      responses:
        "200":
          description: Only verified clinicians who opted into the directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicClinicianList"
  /clinicians/{connectCode}:
    description: "Planned only. The API currently returns HTTP 410 for this path; clinician public profiles are not available."
    get:
      operationId: getPublicClinician
      tags: [partners]
      summary: Get a verified clinician directory profile by its shareable code
      parameters:
        - name: connectCode
          in: path
          required: true
          schema:
            type: string
            minLength: 12
            maxLength: 80
      responses:
        "200":
          description: Public clinician profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicClinician"
        "404":
          description: Profile is not listed or has not been verified
  /patient/clinician-connections:
    description: "Planned only. The API currently returns HTTP 410 for this path; patient-to-clinician journal sharing is not active."
    get:
      operationId: listPatientClinicianConnections
      deprecated: true
      description: Retired URL; returns 410. Use getMyCareTeam instead.
      tags: [journal-sharing]
      summary: List the signed-in patient's active clinician invitations and connections
      responses:
        "200":
          description: Pending and accepted relationships owned by the patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinicianConnectionList"
        "401":
          description: Sign-in required
        "403":
          description: Patient account required
    post:
      operationId: inviteClinicianToJournal
      deprecated: true
      description: Retired URL; returns 410. Use createPatientCareInvite instead.
      tags: [journal-sharing]
      summary: Invite a clinician by their connection code and choose shareable journal areas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianJournalInvitationInput"
      responses:
        "201":
          description: Invitation created or current permissions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinicianConnection"
        "400":
          description: Invalid code or share areas
        "401":
          description: Sign-in required
        "403":
          description: Patient account required
        "404":
          description: Journal or clinician profile not found
        "409":
          description: Patient cannot invite their own clinician account
  /patient/clinician-connections/{connectionId}:
    description: "Planned only. The API currently returns HTTP 410 for this path; patient-to-clinician journal sharing is not active."
    patch:
      operationId: updateClinicianJournalSharing
      deprecated: true
      description: Retired URL; returns 410. The new care-team protocol shares the full journal read-only.
      tags: [journal-sharing]
      summary: Change the journal areas shared with a clinician
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalShareAreasInput"
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinicianConnection"
        "400":
          description: Invalid connection ID or share areas
        "401":
          description: Sign-in required
        "403":
          description: Patient account required
        "404":
          description: Patient-owned invitation or connection not found
    delete:
      operationId: revokeClinicianJournalAccess
      deprecated: true
      description: Retired URL; returns 410. Use removeCareClinician instead.
      tags: [journal-sharing]
      summary: Revoke a clinician's access to the patient's journal
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Access revoked
        "400":
          description: Invalid connection ID
        "401":
          description: Sign-in required
        "403":
          description: Patient account required
        "404":
          description: Patient-owned invitation or connection not found
  /clinician/invitations:
    description: "Planned only. The API currently returns HTTP 410 for this path; patient invitations are not active."
    get:
      operationId: listClinicianJournalInvitations
      deprecated: true
      description: Retired URL; returns 410. New invitations are accepted by a verified-email single-use token.
      tags: [journal-sharing]
      summary: List pending patient invitations for the signed-in clinician
      responses:
        "200":
          description: Invitations awaiting clinician acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianInvitationList"
        "401":
          description: Sign-in required
        "403":
          description: Clinician account required
  /clinician/invitations/{connectionId}/accept:
    description: "Planned only. The API currently returns HTTP 410 for this path; patient invitations are not active."
    post:
      operationId: acceptClinicianJournalInvitation
      deprecated: true
      description: Retired URL; returns 410. Use acceptPatientCareInvite instead.
      tags: [journal-sharing]
      summary: Accept a patient invitation using the clinician's authenticated account
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinicianConnection"
        "400":
          description: Invalid connection ID
        "401":
          description: Sign-in required
        "403":
          description: Clinician account required
        "404":
          description: Invitation not found or already revoked
  /clinician/patients:
    description: "Planned only. The API currently returns HTTP 410 for this path; clinician access to patient journals is not active."
    get:
      operationId: listConnectedPatients
      deprecated: true
      description: Retired URL; returns 410. Use getMyCarePatients instead.
      tags: [journal-sharing]
      summary: List patients who granted journal access to the signed-in clinician
      responses:
        "200":
          description: Active patient relationships and currently allowed areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedPatientList"
        "401":
          description: Sign-in required
        "403":
          description: Clinician account required
  /clinician/patients/{connectionId}:
    description: "Planned only. The API currently returns HTTP 410 for this path; clinician access to patient journals is not active."
    get:
      operationId: getSharedPatientJournal
      deprecated: true
      description: Retired URL; returns 410. Use getCarePatientJournal instead.
      tags: [journal-sharing]
      summary: Read only the journal fields currently permitted by the patient
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Patient journal filtered to the currently shared areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedPatientJournal"
        "400":
          description: Invalid connection ID
        "401":
          description: Sign-in required
        "403":
          description: Clinician account required
        "404":
          description: Active patient connection not found
  /admin/clinicians:
    description: "Planned only. The API currently returns HTTP 410 for this path; clinician verification and directory administration are not active."
    get:
      operationId: listClinicianProfilesForAdmin
      tags: [admin]
      summary: List clinician profiles for manual licence review
      responses:
        "200":
          description: Clinician profiles with contact and verification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClinicianList"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/clinicians/verification:
    description: "Planned only. The API currently returns HTTP 410 for this path; clinician verification is not active."
    patch:
      operationId: updateClinicianVerification
      tags: [admin]
      summary: Mark a clinician licence pending or verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianVerificationUpdate"
      responses:
        "200":
          description: Verification status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianVerificationResponse"
        "400":
          description: Invalid verification status
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Clinician profile not found
  /recovery:
    get:
      operationId: getRecovery
      summary: Get the signed-in person's recovery profile and daily logs
      responses:
        "200":
          description: Private recovery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryState"
        "401":
          description: Sign-in required
    delete:
      operationId: deleteRecovery
      summary: Delete all recovery data belonging to the signed-in person
      responses:
        "204":
          description: Recovery data deleted
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /recovery/start:
    post:
      operationId: startRecovery
      summary: Save consent, quiz preferences, and first daily log atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryStartInput"
      responses:
        "201":
          description: Saved recovery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryState"
        "400":
          description: Invalid input or missing consent
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /recovery/profile:
    put:
      operationId: updateRecoveryProfile
      summary: Update personal routine priorities and support mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryPreferences"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryProfile"
        "400":
          description: Invalid preferences
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
        "404":
          description: Complete onboarding first
  /recovery/logs:
    post:
      operationId: saveRecoveryLog
      summary: Create or update the signed-in person's entry for a calendar day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryLogSaveInput"
      responses:
        "200":
          description: Saved daily log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryLog"
        "400":
          description: Invalid entry
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
        "404":
          description: Complete onboarding first
  /recovery/logs/{date}:
    delete:
      operationId: deleteRecoveryLog
      summary: Delete the signed-in person's entry for one day
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "204":
          description: Entry deleted
        "400":
          description: Invalid date
        "401":
          description: Sign-in required
        "403":
          description: Clinician accounts cannot access patient recovery data
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to Stillwell updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "202":
          description: Subscription accepted (including repeat submissions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionAccepted"
        "400":
          description: Invalid email address
  /newsletter/unsubscribe:
    post:
      operationId: unsubscribeNewsletter
      tags: [newsletter]
      summary: Remove an email address from Stillwell updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "200":
          description: Unsubscription accepted, whether or not the address was on the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterUnsubscriptionAccepted"
        "400":
          description: Invalid email address
components:
  schemas:
    AccountType:
      type: string
      enum: [patient, clinician]
    AccountTypeResponse:
      type: object
      additionalProperties: false
      required: [accountType]
      properties:
        accountType:
          $ref: "#/components/schemas/AccountType"
    AccountRegistrationIntentInput:
      type: object
      additionalProperties: false
      required: [accountType]
      properties:
        accountType:
          $ref: "#/components/schemas/AccountType"
    AccountRegistrationIntent:
      type: object
      additionalProperties: false
      required: [registrationToken]
      properties:
        registrationToken:
          type: string
          minLength: 1
          maxLength: 4096
    CompleteAccountRegistrationInput:
      type: object
      additionalProperties: false
      required: [registrationToken]
      properties:
        registrationToken:
          type: string
          minLength: 1
          maxLength: 4096
    RecoveryPreferences:
      type: object
      additionalProperties: false
      required: [supportMode, priorities]
      properties:
        selectedSymptoms:
          type: array
          maxItems: 11
          uniqueItems: true
          items:
            type: string
            enum: [headache, fatigue, fog, sleep, mood, light, dizziness, nausea, vision, noise, neck]
        supportMode:
          type: string
          enum: [self_guided, clinician_supported]
        priorities:
          type: array
          minItems: 0
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [food_hydration, movement, meditation, pacing]
    SymptomEntry:
      type: object
      additionalProperties: false
      required: [name, severity]
      properties:
        name:
          type: string
          enum: [headache, dizziness, focus, fatigue, sleep, light_sound, mood, nausea, vision, noise, neck]
        severity:
          type: integer
          minimum: 0
          maximum: 10
    DailyCheckInSymptomAnswer:
      type: object
      additionalProperties: false
      required: [name, status, rating]
      properties:
        name:
          type: string
          enum: [headache, fatigue, fog, sleep, mood, light, dizziness, nausea, vision, noise, neck]
        status:
          type: string
          enum: [recorded, not_recorded]
        rating:
          type: integer
          enum: [0, 1, 2, 3]
          nullable: true
        addedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Date this symptom first appeared in the patient's tracked list.
    DailyCheckIn:
      type: object
      additionalProperties: false
      required: [overallFeeling, symptoms, summary]
      properties:
        selectedSymptoms:
          type: array
          maxItems: 11
          uniqueItems: true
          items:
            type: string
            enum: [headache, fatigue, fog, sleep, mood, light, dizziness, nausea, vision, noise, neck]
        worseWithActivity:
          type: string
          enum: [yes, no, not_sure]
          nullable: true
        overallFeeling:
          type: string
          enum: [rough, low, okay, good, great]
          nullable: true
        symptoms:
          type: array
          minItems: 6
          maxItems: 11
          items:
            $ref: "#/components/schemas/DailyCheckInSymptomAnswer"
        summary:
          type: string
          maxLength: 500
    ActivityStatus:
      type: string
      enum: [done, not_done, not_planned]
    SleepLog:
      type: object
      additionalProperties: false
      description: Optional record of the night ending on the journal date. Patients may enter approximate hours in half-hour steps; older entries may use local clock times.
      properties:
        hoursSlept:
          type: [number, "null"]
          minimum: 0
          maximum: 24
          multipleOf: 0.5
          description: Optional approximate hours slept in half-hour steps. The journal input stepper offers 0 to 14 hours. Older entries may contain bedtime and wakeTime instead.
        bedtime:
          type: [string, "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        wakeTime:
          type: [string, "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        quality:
          type: [string, "null"]
          enum: [poor, fair, good, great, null]
        wakings:
          type: [integer, "null"]
          enum: [0, 1, 2, 3, null]
          description: 3 represents three or more awakenings.
        nap:
          type: [string, "null"]
          enum: [none, under_30, 30_or_more, null]
        note:
          type: string
          maxLength: 280
    RecoveryLogInput:
      type: object
      additionalProperties: false
      required: [date, symptoms, dietStatus, dietNote, exerciseStatus, exerciseNote, meditationStatus, meditationMinutes, meditationNote, note]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        symptoms:
          type: array
          maxItems: 11
          items:
            $ref: "#/components/schemas/SymptomEntry"
        dietStatus:
          $ref: "#/components/schemas/ActivityStatus"
        dietNote:
          type: string
          maxLength: 2000
        exerciseStatus:
          $ref: "#/components/schemas/ActivityStatus"
        exerciseNote:
          type: string
          maxLength: 2000
        meditationStatus:
          $ref: "#/components/schemas/ActivityStatus"
        meditationMinutes:
          type: integer
          minimum: 0
          maximum: 240
        meditationNote:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000
        dailyCheckIn:
          $ref: "#/components/schemas/DailyCheckIn"
        sleep:
          anyOf:
            - $ref: "#/components/schemas/SleepLog"
            - type: "null"
    RecoveryLogSaveInput:
      allOf:
        - $ref: "#/components/schemas/RecoveryLogInput"
        - type: object
          properties:
            section:
              type: string
              enum: [check_in, activities, sleep, journal]
              description: Atomically update only this journal section, preserving fields written on another device. Journal updates include check-in and sleep together. Omit for backwards-compatible merge.
    RecoveryStartInput:
      type: object
      additionalProperties: false
      required: [preferences, consentAccepted, firstLog]
      properties:
        preferences:
          $ref: "#/components/schemas/RecoveryPreferences"
        consentAccepted:
          type: boolean
          enum: [true]
        firstLog:
